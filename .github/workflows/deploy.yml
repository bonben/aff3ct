name: Deploy

on:
  push:
    branches:
      - master
      - develop
      - ppa_upload
      - github-actions-migration

defaults:
  run:
    shell: bash

jobs:
  build-doc:
    runs-on: ubuntu-latest
    container: registry.gitlab.com/aff3ct/aff3ct/x86_64_ubuntu_doc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: false
      - name: Update submodules with fallback
        run: |
          git config --global --add safe.directory '*'
          if ! git submodule update --init --recursive; then
            echo "Failed to find submodules on ${{ github.repository_owner }}. Falling back to upstream aff3ct..."
            git config --global url."https://github.com/aff3ct/".insteadOf "https://github.com/${{ github.repository_owner }}/"
            git submodule update --init --recursive
          fi
      - name: Generate Documentation
        run: |
          export THREADS="4"
          ./ci/analysis-documentation.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ppa-documentation
          path: |
            doc/build/html
            doc/build/doxygen

  deploy-ppa:
    needs: build-doc
    runs-on: ubuntu-latest
    container: registry.gitlab.com/aff3ct/aff3ct/x86_64_ubuntu_ppa
    env:
      DISTRIBS: "jammy;noble;resolute"
      CXX: g++
      NAME: build_deploy_upload_ppa
      CI_AFF3CT_DEPLOY: "ON"
      GIT_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Update submodules with fallback
        run: |
          git config --global --add safe.directory '*'
          if ! git submodule update --init --recursive; then
            echo "Failed to find submodules on ${{ github.repository_owner }}. Falling back to upstream aff3ct..."
            git config --global url."https://github.com/aff3ct/".insteadOf "https://github.com/${{ github.repository_owner }}/"
            git submodule update --init --recursive
          fi

      - uses: actions/download-artifact@v4
        with:
          name: ppa-documentation
          path: doc/build

      - name: Import GPG Key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import --pinentry-mode loopback --no-tty
            KEYID=$(gpg --list-secret-keys --keyid-format=long | awk '/^sec/ {print $2}' | cut -d'/' -f2 | head -n1)
            echo "DEBSIGN_KEYID=\"$KEYID\"" > ~/.devscripts
            echo "DEBUILD_DPKG_BUILDPACKAGE_OPTS=\"-k$KEYID\"" >> ~/.devscripts
            echo "Configured debuild to sign with key ID: $KEYID"
          fi

      - name: Deploy PPA
        env:
          LAUNCHPAD_SSH_KEY: ${{ secrets.LAUNCHPAD_SSH_KEY }}
        run: |
          source ./ci/tools/git-branch.sh
          ./ci/deploy/deploy-upload-ppa.sh

